name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Install Capacitor and Setup App
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/device @capacitor/filesystem @capacitor/share
        npm install @capawesome/capacitor-screenshot
        
        # Build the capacitor config using your exact local directory layout
        echo "{\"appId\": \"com.treas_rec.v2_6_0_evc\", \"appName\": \"TreasRecorder\", \"webDir\": \"app/src/main/assets\"}" > capacitor.config.json
        
        npx cap add android

    - name: Download and Inject Offline Speech Model
      run: |
        # Download the compact English speech recognition model directly
        wget https://alphacephei.com
        
        # Unzip the downloaded file package
        unzip vosk-model-small-en-us-0.15.zip
        
        # Ensure the destination directory exists inside the native layout structure
        mkdir -p android/app/src/main/assets
        
        # Move it directly into your native asset directory path
        mv vosk-model-small-en-us-0.15 android/app/src/main/assets/model

    - name: Inject Custom Java Voice Plugins
      run: |
        # Copy the pre-made Java services straight from your repository into Capacitor's build paths
        cp app/src/main/java/EveVoicePlugin.java android/app/src/main/java/com/treas_rec/v2_6_0_evc/EveVoicePlugin.java
        cp app/src/main/java/EveVoiceService.java android/app/src/main/java/com/treas_rec/v2_6_0_evc/EveVoiceService.java

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Configure Android Package Permissions & Vosk Dependency
      run: |
        # Setup application naming packages matching your java namespace
        sed -i 's/applicationId ".*"/applicationId "com.treas_rec.v2_6_0_evc"/' android/app/build.gradle
        sed -i 's/package=".*"/package="com.treas_rec.v2_6_0_evc"/' android/app/src/main/AndroidManifest.xml
        
        # Inject the offline Vosk compilation dependency into gradle
        echo "dependencies { implementation 'org.alphacephei:vosk-android:0.3.38' }" >> android/app/build.gradle
        
        # Inject microphone hardware access keys
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' android/app/src/main/AndroidManifest.xml
        
        # Register the foreground listener service block
        sed -i '/<\/application>/i \        <service android:name=".EveVoiceService" android:enabled="true" android:exported="false" android:foregroundServiceType="microphone" />' android/app/src/main/AndroidManifest.xml

        # Link EveVoicePlugin directly inside Capacitor's native MainActivity loader
        sed -i '/initialize(this/i \ \ \ \ \ \ \ \ registerPlugin(EveVoicePlugin.class);' android/app/src/main/java/com/treas_rec/v2_6_0_evc/MainActivity.java || true
        
        # Standard native isolation alignment
        find android/app/src/main/ -type f -name "AndroidManifest.xml" \
          -exec sed -i -E 's/android:authorities="[^"]*\.fileprovider"/android:authorities="com.treas_rec.v2_6_0_evc.fileprovider"/g' {} +
        find android/app/src/main/ -type f -name "MainActivity.java" \
          -exec sed -i 's/^package .*;/package com.treas_rec.v2_6_0_evc;/' {} +
        find android/app/src/main/java -name "MainActivity.java" \
          ! -path "*/com/treas_rec/v2_6_0_evc/*" \
          -exec cp {} android/app/src/main/java/com/treas_rec/v2_6_0_evc/MainActivity.java \;

    - name: Build Final Compiled APK Bundle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug

    - name: Upload Completed Artifact Package
      uses: actions/upload-artifact@v4
      with:
        name: TreasRecorder-OfflineVoice-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
